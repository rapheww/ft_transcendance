[project]
name = "tracen-lo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.4",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
tracen-lo = "tracen_lo:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
